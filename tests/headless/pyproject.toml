[project]
name = "godot-headless-tests"
version = "0.1.0"
description = "End-to-end tests and client for Godot's headless testing features."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["godot_testing"]
